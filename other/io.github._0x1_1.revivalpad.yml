# Flatpak manifest for RevivalPad.
#
# NOTE: RevivalPad is NOT published on Flathub. This manifest exists so the
# application can be built locally with flatpak-builder:
#
#   flatpak-builder --user --install --force-clean \
#       build-flatpak other/io.github._0x1_1.revivalpad.yml
#
# If the fork is built under a different GitHub account, rename this file to
# match REVIVALPAD_APP_ID from CMakeLists.txt and update app-id below.

app-id: io.github._0x1_1.revivalpad
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: revivalpad
finish-args:
  # KDE Plasma tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Gamepads
  - --device=all
  # Portals still cannot hand the application arbitrary profile paths, so the
  # home directory is needed to load and save .amgp profiles.
  - --filesystem=home

modules:
  - name: revivalpad
    buildsystem: cmake
    config-opts:
      - -DREVIVALPAD_PKG_VERSION=flatpak-localbuild
      - -DINSTALL_UINPUT_UDEV_RULES=OFF
      - -DWITH_X11=OFF
    sources:
      # - type: git
      #   url: https://github.com/0x1-1/revivalpad.git
      #   tag: 1.0.0
      - type: dir
        path: ../
